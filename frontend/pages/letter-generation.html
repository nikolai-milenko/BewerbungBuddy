<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motivationsschreiben Generator</title>
  <link rel="stylesheet" href="../assets/style/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="gradient-bg">
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="../index.html">BewerbungsBuddy</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="cv-analysis.html">CV Analyse</a></li>
          <li class="nav-item"><a class="nav-link" href="letter-generation.html">Motivationsschreiben</a></li>
          <li class="nav-item"><a class="nav-link" href="pricing.html">Preise</a></li>
          <li class="nav-item"><a class="nav-link" href="team.html">Unser Team</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container py-5">
    <h1 class="mb-4">Motivationsschreiben Generator</h1>

    <div class="row">
      <div class="col-md-6">
        <label for="letterUpload" class="form-label">Lebenslauf hochladen (PDF oder Bild)</label>
        <input type="file" class="form-control" id="letterUpload" accept="application/pdf,image/jpeg,image/png">
        <p id="letterFileNameDisplay" class="mt-2 text-muted"></p>

        <label for="letterJobDesc" class="form-label mt-4">Stellenbeschreibung</label>
        <textarea class="form-control" id="letterJobDesc" rows="6" placeholder="Fügen Sie hier die Stellenanzeige ein..."></textarea>

        <button class="btn btn-success mt-4">Motivationsschreiben generieren</button>
      </div>

      <div class="col-md-6">
        <div id="letterPreviewContainer" class="border rounded p-3 bg-white shadow-sm mt-4 mt-md-0">
          <p class="text-muted">📄 Vorschau wird hier angezeigt...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/letter-generation.js"></script>
</body>
</html>
