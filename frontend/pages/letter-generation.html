<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motivationsschreiben Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/style/style.css" />

</head>
<body>
 <!-- Navbar -->
 <nav class="nav">
  <!-- Logo -->
  <a href="../index.html" class="logo">
    <img src="/assets/images/logo.png" alt="Logo" />
  </a>

  <!-- Search -->
  <div class="input-field">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" placeholder="Type Something" class="search-input" />
  </div>

  <!-- Navigation Links -->
  <div class="links">
    <a href="../index.html" class="link">Home</a>
    <a href="cv-analysis.html" class="link">CV Analyse</a>
    <a href="letter-generation.html" class="link">Motivationsschreiben</a>
    <a href="pricing.html" class="link">Preise</a>
    <a href="team.html" class="link">Unser Team</a>
  </div>
</nav>


  <div class="container py-5">
    <h1 class="mb-4">Motivationsschreiben Generator</h1>

    <div class="row">
      <div class="col-md-6">
        <label for="letterUpload" class="form-label">Lebenslauf hochladen (PDF oder Bild)</label>
        <input type="file" class="form-control" id="letterUpload" accept="application/pdf,image/jpeg,image/png">
        <p id="letterFileNameDisplay" class="mt-2 text-muted"></p>

        <label for="letterJobDesc" class="form-label mt-4">Stellenbeschreibung</label>
        <textarea class="form-control" id="letterJobDesc" rows="6" placeholder="Fügen Sie hier die Stellenanzeige ein..."></textarea>

        <button class="btn btn-success mt-4" onclick="generateCoverLetter()">Motivationsschreiben generieren</button>
      </div>

      <div class="col-md-6">
        <div id="letterPreviewContainer" class="border rounded p-3 bg-white shadow-sm mt-4 mt-md-0">
          <p class="text-muted">📄 Vorschau wird hier angezeigt...</p>
        </div>
      </div>
    </div>
  </div>
  <!-- Footer -->
  <footer class="footer" style="background: var(--bg-dark); color: var(--text-light); opacity: 0.6;">
    <div class="container text-center py-4">
      <div class="mb-2">© 2025 BewerbungsBuddy. Alle Rechte vorbehalten.</div>
      <div style="font-size: 0.9rem;">
        <a href="#" style="color: var(--text-light); text-decoration: underline; opacity: 0.7; margin-right: 1rem;">Impressum</a>
        <a href="#" style="color: var(--text-light); text-decoration: underline; opacity: 0.7;">Datenschutz</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../assets/js/script.js"></script>
</body>
</html>
