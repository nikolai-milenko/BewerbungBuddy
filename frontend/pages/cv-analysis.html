    <h1 class="mb-4">CV-Analyse</h1>
  
    <div class="mb-3">
      <label for="cvUpload" class="form-label">Lebenslauf hochladen (PDF oder Bild)</label>
      <input type="file" class="form-control" id="cvUpload" accept="application/pdf,image/jpeg,image/png">
      <p id="fileNameDisplay" class="mt-2 text-muted"></p>
    </div>
  
    <div class="mb-4">
      <label for="jobDescription" class="form-label">Stellenbeschreibung</label>
      <textarea class="form-control" id="jobDescription" rows="5" placeholder="Fügen Sie hier die Stellenbeschreibung ein..."></textarea>
    </div>
  
    <div id="previewContainer" class="mt-4 border rounded p-3 bg-white shadow-sm">
      <p class="text-muted">📄 Vorschau wird hier angezeigt...</p>
    </div>
  
    <button class="btn btn-primary mt-4">Analyse starten</button>
