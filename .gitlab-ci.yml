stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2

# FOR ALL BRANCHES EXCEPT MAIN
build-backend:
  stage: build
  image: maven:3.9.5-eclipse-temurin-21-alpine
  services:
    - name: postgres:16
      alias: db
  variables:
    POSTGRES_DB: bewerbungsbuddy
    POSTGRES_USER: user
    POSTGRES_PASSWORD: password
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bewerbungsbuddy
    SPRING_DATASOURCE_USERNAME: user
    SPRING_DATASOURCE_PASSWORD: password
  before_script:
    - cd backend
  script:
    - ./mvnw clean install -DskipTests
  artifacts:
    when: on_success
    paths:
      - backend/target/*.jar
    expire_in: 1 week
  except:
    - main

test-backend:
  stage: test
  image: maven:3.9.5-eclipse-temurin-21-alpine
  before_script:
    - cd backend
  script:
    - ./mvnw test
  dependencies:
    - build-backend
  except:
    - main

build-frontend:
  stage: build
  image: alpine
  before_script:
    - cd frontend || echo "frontend folder not found"
  script:
    - echo "No real frontend yet"
  except:
    - main

# FOR MAIN BRANCH ONLY
fullstack-build:
  stage: build
  image: maven:3.9.5-eclipse-temurin-21-alpine
  services:
    - name: postgres:16
      alias: db
  variables:
    POSTGRES_DB: bewerbungsbuddy
    POSTGRES_USER: user
    POSTGRES_PASSWORD: password
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bewerbungsbuddy
    SPRING_DATASOURCE_USERNAME: user
    SPRING_DATASOURCE_PASSWORD: password
  before_script:
    - apk add --no-cache findutils sed # SED TO CHANGE LINKS IN HTML
  script:
    # HARDCODED STEPS FOR FULLSTACK BUILD
    - echo "Building frontend..."
    # COPY FRONTEND TO BACKEND
    - rm -rf backend/src/main/resources/static || true
    - mkdir -p backend/src/main/resources/static
    - |
      if [ "$(ls -A frontend | grep -v '^\.\.*$')" ]; then
        echo "Copying frontend files..."
        cp -r frontend/* backend/src/main/resources/static/
      else
        echo "No visible frontend files, skipping copy"
      fi
    # CHANGE LINKS IN HTML FILES
    - |
      find backend/src/main/resources/static -type f -name "*.html" | while read file; do
        echo "Rewriting links in $file"
        sed -i -E 's/href="([a-zA-Z0-9_-]+)\.html"/href="\/\1"/g' "$file"
      done
    # BUILD BACKEND
    - cd backend
    - ./mvnw clean install -DskipTests
  artifacts:
    when: on_success
    paths:
      - backend/target/*.jar
    expire_in: 1 week
  only:
    - main

release:
  stage: deploy
  image: curlimages/curl:latest
  script:
    - VERSION="$(date +%Y%m%d%H%M)"   # или свой способ генерить версию
    - git tag "$VERSION"
    - git push origin "$VERSION"
    - |
      echo "Creating GitLab release for $VERSION"
      curl --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"Release $VERSION\",
          \"tag_name\": \"$VERSION\",
          \"description\": \"Auto-generated release from main\"
        }" \
        "https://gitlab.example.com/api/v4/projects/$CI_PROJECT_ID/releases"
  needs:
    - job: fullstack-build
      artifacts: true
  only:
    - main
